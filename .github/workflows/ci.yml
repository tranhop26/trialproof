name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the npm 11 lockfile generator used by the project.
          node-version: "24"
          cache: npm

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Cache GenVM direct-test runner
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
          key: gltest-direct-v0.3.0-rc7-e218a185

      - name: Prepare GenVM direct-test runner
        shell: bash
        run: |
          artifact="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          if [[ ! -f "$artifact" ]]; then
            mkdir -p "$(dirname "$artifact")"
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              --output "$artifact"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $artifact" \
            | sha256sum --check

      - name: Check Python formatting
        run: ruff format --check contracts tests scripts

      - name: Lint Intelligent Contract for GenVM
        env:
          PYTHONIOENCODING: utf-8
        run: genvm-lint check contracts/trial_proof.py

      - name: Verify deploy artifact is reproducible
        run: python scripts/build_bradbury_contract.py --check

      - name: Run direct and tooling tests
        run: pytest tests/direct tests/tooling -q

      - name: Run integration tests
        run: pytest tests/integration -q

      - name: Run TypeScript tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck
